name: Close inactive issues/PR

on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一检查

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: 'stale'
          stale-issue-message: 'This issue is stale because it has been open for 90 days with no activity.'
          close-issue-message: 'This issue was closed because it has been inactive for 30 days since being marked stale.'
          days-before-pr-stale: 90
          days-before-pr-close: 30
          stale-pr-label: 'stale'
          stale-pr-message: 'This PR is stale because it has been open for 90 days with no activity.'
          close-pr-message: 'This PR was closed because it has been inactive for 30 days since being marked stale.'
          operations-per-run: 30
