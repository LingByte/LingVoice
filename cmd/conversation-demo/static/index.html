<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingVoice 对话 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #e94560; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
        .container {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #0f3460;
            border-radius: 8px;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .status-dot.connected { background: #4ecca3; }
        .status-dot.negotiating { background: #f39c12; animation: pulse 1s infinite; }
        .status-dot.streaming { background: #e94560; animation: pulse 0.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }
        .status-text { font-size: 14px; }
        .chat-log {
            height: 240px;
            overflow-y: auto;
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .chat-log .msg { margin-bottom: 6px; }
        .chat-log .msg .from { color: #e94560; font-weight: bold; }
        .chat-log .msg .from.bot { color: #4ecca3; }
        .chat-log .msg .time { color: #666; font-size: 11px; margin-left: 8px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-connect { background: #4ecca3; color: #16213e; }
        .btn-connect:hover:not(:disabled) { background: #3eb892; }
        .btn-call { background: #e94560; color: white; }
        .btn-call:hover:not(:disabled) { background: #d63852; }
        .btn-call.recording { background: #f39c12; animation: pulse 1s infinite; }
        .btn-hangup { background: #666; color: white; }
        .btn-hangup:hover:not(:disabled) { background: #555; }
        .text-input {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .text-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
        }
        .text-input button {
            background: #0f3460;
            color: #4ecca3;
            border: 1px solid #4ecca3;
        }
        .audio-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #0f3460;
            border-radius: 8px;
        }
        .audio-section audio { flex: 1; }
        .info {
            margin-top: 16px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .info code { color: #e94560; background: #0f3460; padding: 2px 6px; border-radius: 4px; }
        .vumeter {
            display: inline-block;
            width: 120px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            vertical-align: middle;
        }
        .vumeter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4ecca3, #f39c12, #e94560);
            transition: width 0.05s;
        }
    </style>
</head>
<body>
    <h1>LingVoice 对话 Demo</h1>
    <p class="subtitle">WebSocket 协议层 Demo · 浏览器麦克风 → PCM16 → 服务端接收（媒体处理由 Rust 媒体层负责）</p>

    <div class="container">
        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">未连接</span>
        </div>

        <div class="chat-log" id="chatLog"></div>

        <div class="controls">
            <button class="btn-connect" id="btnConnect" onclick="connect()">连接</button>
            <button class="btn-call" id="btnCall" onclick="toggleCall()" disabled>开始通话</button>
            <button class="btn-hangup" id="btnHangup" onclick="hangup()" disabled>挂断</button>
        </div>

        <div class="text-input">
            <input type="text" id="textInput" placeholder="输入文字消息..." onkeypress="if(event.key==='Enter')sendText()">
            <button onclick="sendText()">发送</button>
        </div>

        <div class="audio-section">
            <span>🎤</span>
            <span>录音中（服务端仅接收统计，不做媒体处理）</span>
            <span class="vumeter"><span class="vumeter-fill" id="vuFill"></span></span>
        </div>

        <div class="info">
            <p>协议: WebSocket (ws://<span id="wsHost"></span>/ws/voice)</p>
            <p>音频: PCM 16-bit 16kHz mono → 服务端接收并统计（不做媒体处理）</p>
            <p>媒体层（回声/混音/ASR）由 Rust 实现，本 demo 仅演示协议层</p>
            <p>使用前请允许浏览器麦克风权限</p>
        </div>
    </div>

<script>
const PROTOCOL_VERSION = 1;
let ws = null;
let sessionNegotiated = false;
let mediaStream = null;
let audioContext = null;
let processor = null;
let isRecording = false;
let remoteAudioCtx = null;
let seqNum = 0;

const $ = id => document.getElementById(id);
const wsHost = location.host;
$('wsHost').textContent = wsHost;

function setStatus(state, text) {
    const dot = $('statusDot');
    dot.className = 'status-dot ' + state;
    $('statusText').textContent = text;
}

function addChat(from, text, isBot) {
    const log = $('chatLog');
    const time = new Date().toLocaleTimeString();
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `<span class="from ${isBot?'bot':''}">${from}</span>: ${text}<span class="time">${time}</span>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

// === WebSocket 连接 ===
function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;

    setStatus('negotiating', '连接中...');
    const wsUrl = `ws://${wsHost}/ws/voice`;
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        setStatus('connected', '已连接，协商中...');
        addChat('系统', 'WebSocket 已连接，发送 offer...', true);
        sendOffer();
    };

    ws.onmessage = (event) => {
        if (typeof event.data === 'string') {
            handleTextMessage(event.data);
        } else {
            handleBinaryMessage(event.data);
        }
    };

    ws.onclose = () => {
        setStatus('', '连接已断开');
        addChat('系统', '连接已断开', true);
        sessionNegotiated = false;
        $('btnCall').disabled = true;
        $('btnHangup').disabled = true;
        $('btnConnect').disabled = false;
        stopRecording();
    };

    ws.onerror = (err) => {
        addChat('系统', 'WebSocket 错误', true);
        console.error('WS error', err);
    };

    $('btnConnect').disabled = true;
}

function sendOffer() {
    const offer = {
        type: 'offer',
        version: PROTOCOL_VERSION,
        media: {
            audio: {
                codecs: ['pcm16'],
                sampleRate: 16000,
                channels: 1,
                frameMs: 20
            }
        }
    };
    ws.send(JSON.stringify(offer));
}

function handleTextMessage(data) {
    let msg;
    try { msg = JSON.parse(data); } catch(e) { return; }

    switch (msg.type) {
    case 'answer':
        addChat('系统', `协商完成: ${msg.media?.audio?.codec || 'unknown'} / ${msg.media?.audio?.sampleRate}Hz`, true);
        sessionNegotiated = true;
        setStatus('connected', '协商完成，可以通话');
        $('btnCall').disabled = false;
        break;
    case 'ready':
        setStatus('streaming', '通话中...');
        addChat('系统', '媒体通道就绪', true);
        break;
    case 'stop':
        addChat('系统', '通话结束', true);
        hangup();
        break;
    case 'error':
        addChat('系统', `错误: ${msg.code} - ${msg.message}`, true);
        break;
    case 'chat':
        addChat('Bot', msg.message, true);
        break;
    }
}

function handleBinaryMessage(buffer) {
    // 服务端不再回声音频帧，这里不会收到二进制消息
    // 保留处理逻辑以备媒体层接入后使用
    console.log('收到二进制帧:', buffer.byteLength, 'bytes');
}

// === 通话控制 ===
async function toggleCall() {
    if (!isRecording) {
        await startCall();
    } else {
        stopRecording();
        setStatus('connected', '已暂停录音');
        $('btnCall').textContent = '继续通话';
        $('btnCall').classList.remove('recording');
    }
}

async function startCall() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                sampleRate: 16000,
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true,
            }
        });

        audioContext = new AudioContext({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(mediaStream);

        // 使用 ScriptProcessorNode 捕获 PCM（兼容性好）
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        source.connect(processor);
        processor.connect(audioContext.destination);

        processor.onaudioprocess = (e) => {
            if (!isRecording) return;
            const inputData = e.inputBuffer.getChannelData(0);
            // 降采样到 16kHz（如果 AudioContext 不是 16kHz）
            const pcm16 = floatToPCM16(inputData);
            sendAudioFrame(pcm16);
            updateVuMeter(inputData);
        };

        // 发送 start 消息
        ws.send(JSON.stringify({ type: 'start' }));
        isRecording = true;
        $('btnCall').textContent = '暂停录音';
        $('btnCall').classList.add('recording');
        $('btnHangup').disabled = false;
        addChat('系统', '通话开始，请说话...', true);
    } catch (err) {
        addChat('系统', '麦克风权限获取失败: ' + err.message, true);
        console.error('getUserMedia error', err);
    }
}

function stopRecording() {
    isRecording = false;
    if (processor) {
        processor.disconnect();
        processor = null;
    }
    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
    }
    $('vuFill').style.width = '0%';
}

function hangup() {
    stopRecording();
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }));
    }
    $('btnCall').textContent = '开始通话';
    $('btnCall').classList.remove('recording');
    $('btnHangup').disabled = true;
    setStatus('connected', '已挂断');
}

// === 音频编码/发送 ===
function floatToPCM16(float32) {
    const pcm16 = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return pcm16;
}

function sendAudioFrame(pcm16) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    // 二进制帧格式: [1B type][1B codec][4B ts][2B seq][4B sr][2B ch][payload]
    const header = new ArrayBuffer(14);
    const view = new DataView(header);
    view.setUint8(0, 0x01);           // type = audio
    view.setUint8(1, 0x04);           // codec = pcm16
    view.setUint32(2, seqNum * 320);  // timestamp (16kHz * 20ms = 320 samples)
    view.setUint16(6, seqNum);        // sequence
    view.setUint32(8, 16000);         // sampleRate
    view.setUint16(12, 1);            // channels
    seqNum++;

    // 合并 header + payload
    const frame = new Uint8Array(14 + pcm16.byteLength);
    frame.set(new Uint8Array(header), 0);
    frame.set(new Uint8Array(pcm16.buffer), 14);
    ws.send(frame.buffer);
}

// === 音频播放 ===
// 媒体层（Rust）接入后，服务端会返回处理后的音频帧，届时在此播放
// function playPcm16(buffer, sampleRate, channels) { ... }

// === VU 表 ===
function updateVuMeter(float32) {
    let max = 0;
    for (let i = 0; i < float32.length; i++) {
        const abs = Math.abs(float32[i]);
        if (abs > max) max = abs;
    }
    const percent = Math.min(100, max * 200);
    $('vuFill').style.width = percent + '%';
}

// === 文字聊天 ===
function sendText() {
    const input = $('textInput');
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    // 发送为 chat 类型的信令消息（扩展协议）
    ws.send(JSON.stringify({ type: 'chat', message: text }));
    addChat('我', text, false);
    input.value = '';
}
</script>
</body>
</html>
